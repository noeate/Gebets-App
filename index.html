<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wacht und betet</title>
<meta name="description" content="Gebetstimer: drei Gebetszeiten, eine Stunde am Tag.">
<meta name="theme-color" content="#0E1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wacht und betet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1520'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23C8A45C' stroke-width='2.5'/%3E%3Cpath d='M16 10.5v6' stroke='%23C8A45C' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1520;
  --panel:#151E2C;
  --panel-2:#1B2434;
  --line:rgba(233,228,217,.13);
  --line-strong:rgba(233,228,217,.26);
  --ink:#E9E4D9;
  --dim:#94A0B0;
  --brass:#C8A45C;
  --brass-dim:rgba(200,164,92,.22);
  --olive:#7FA06B;
  --olive-dim:rgba(127,160,107,.16);
  --radius:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 20px 72px;
}
.wrap{max-width:680px;margin:0 auto}

/* ---------- Kopf ---------- */
.topbar{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:26px 0 22px;border-bottom:1px solid var(--line);
}
.mark{
  font-family:"EB Garamond",Georgia,serif;font-size:19px;letter-spacing:.01em;
  color:var(--ink);text-decoration:none;
}
.mark span{color:var(--brass)}
.today-date{font-size:13.5px;color:var(--dim)}

/* ---------- Schrift / Verse ---------- */
.verse{
  font-family:"EB Garamond",Georgia,serif;
  font-size:22px;line-height:1.62;letter-spacing:.005em;
  max-width:56ch;margin:0;
}
.verse.hero{font-size:27px;line-height:1.55}
.verse .vn{color:var(--brass);font-size:.72em;vertical-align:.28em;padding-right:.15em}
.ref{
  font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:var(--dim);
  margin-top:14px;
}
.hero-block{padding:40px 0 38px;border-bottom:1px solid var(--line)}
.day-verse{padding:26px 0 28px;border-bottom:1px solid var(--line)}

/* ---------- Stundenmesser ---------- */
.hour{padding:26px 0 24px;border-bottom:1px solid var(--line)}
.hour-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hour-count{
  font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;line-height:1.1;
}
.hour-count b{font-weight:500;color:var(--brass)}
.hour-note{font-size:13px;color:var(--dim);padding-bottom:5px}
.hour-note.done{color:var(--olive)}
.ticks{display:flex;gap:2px;margin-top:16px;height:34px;align-items:flex-end}
.tick{flex:1 1 0;background:var(--line);height:16px;border-radius:1px;transition:height .25s ease,background .25s ease}
.tick.q{height:24px}
.tick.on{background:var(--brass);height:26px}
.tick.on.q{height:34px}
.tick.full{background:var(--olive)}
.tick.part{background:var(--brass-dim)}

/* ---------- Schaltflächen ---------- */
.btn{
  font:inherit;font-size:14.5px;color:var(--ink);
  background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-block;
  transition:border-color .15s ease,background .15s ease,color .15s ease;
}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#14100A;font-weight:500}
.btn.primary:hover{background:#D8B570;border-color:#D8B570;color:#14100A}
.btn.small{padding:7px 13px;font-size:13.5px}
.btn.running{border-color:var(--brass);color:var(--brass)}
.btn.check{border-color:var(--line-strong)}
.btn.check.on{border-color:var(--olive);color:var(--olive)}
.row{display:flex;gap:10px;flex-wrap:wrap;padding:22px 0}
.row.tight{padding:0}

/* ---------- Spontan ---------- */
.spontan{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.spontan .lbl{font-size:14.5px;color:var(--dim);flex:1 1 180px}
.clock{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:.01em;min-width:86px}
.clock.live{color:var(--brass)}

/* ---------- Zeitig aufgewacht ---------- */
.wake{padding:20px 0;border-bottom:1px solid var(--line)}
.wake-btn{
  display:flex;align-items:center;gap:11px;width:100%;
  background:none;border:0;padding:0;cursor:pointer;color:var(--dim);
  font:inherit;font-size:16px;text-align:left;
  transition:color .15s ease;
}
.wake-btn:hover{color:var(--ink)}
.wake-btn.on{color:var(--olive)}
.wake-btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:2px}
.wake-btn.on .check-mark{background:var(--olive);border-color:var(--olive);color:#101A0E}
.pip.early{background:var(--line-strong)}
.pip.early.on{background:var(--brass)}

/* ---------- Wachen ---------- */
.watch{padding:24px 0;border-bottom:1px solid var(--line);position:relative}
.watch.done{opacity:.96}
.watch-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.watch-name{font-family:"EB Garamond",Georgia,serif;font-size:21px;letter-spacing:.01em}
.watch.done .watch-name{color:var(--olive)}
.watch-focus{font-size:13.5px;color:var(--dim);margin-top:4px;max-width:46ch}
.check-mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;
  border:1px solid var(--line-strong);color:transparent;flex:0 0 auto;
}
.watch.done .check-mark{background:var(--olive);border-color:var(--olive);color:#101A0E}
.check-mark svg{width:11px;height:11px}
.watch-body{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.watch-body .clock{font-size:31px;font-weight:500;min-width:104px}
.watch.done .watch-body .clock{color:var(--olive)}
.stop{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;
  padding-top:14px;border-top:1px dashed var(--line);
}
.stop .lbl{font-size:13px;color:var(--dim);flex:1 1 150px}
.stop .clock{font-size:18px;min-width:72px}
.sum{font-size:13px;color:var(--dim);margin-top:12px}
.sum b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- Herz ---------- */
.heart-block{padding:28px 0 8px}
.heart-q{font-family:"EB Garamond",Georgia,serif;font-size:20px;margin:0 0 14px}
.hearts{display:flex;gap:9px}
.heart{
  background:none;border:0;padding:5px;cursor:pointer;line-height:0;
  color:var(--line-strong);transition:color .15s ease,transform .15s ease;
}
.heart svg{width:27px;height:27px;display:block}
.heart:hover{transform:translateY(-2px)}
.heart.on{color:#C46A6A}
.heart:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}
.heart-note{font-size:13px;color:var(--dim);margin-top:10px;min-height:20px}

/* ---------- Statistik ---------- */
.stats{padding:26px 0 0}
.stat{padding:20px 0;border-bottom:1px solid var(--line)}
.stat-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.stat-name{font-family:"EB Garamond",Georgia,serif;font-size:19px}
.stat-val{font-size:14.5px;font-variant-numeric:tabular-nums}
.stat-val b{color:var(--brass);font-weight:500}
.bars{display:flex;gap:6px;align-items:flex-end;margin-top:16px}
.wheart{position:relative;display:block;width:14px;height:14px;color:var(--line-strong)}
.wheart svg{width:14px;height:14px;display:block;fill:currentColor}
.wh-fill{position:absolute;top:0;left:0;bottom:0;overflow:hidden;color:#C46A6A;display:block}
.wh-fill svg{width:14px;height:14px}
.stat-sub b{color:#C46A6A;font-weight:500;font-variant-numeric:tabular-nums}
.bar-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;background:var(--brass-dim);border-radius:1px;min-height:2px;transition:height .3s ease}
.bar.goal{background:var(--olive)}
.bar.today{outline:1px solid var(--line-strong);outline-offset:1px}
.bar-lbl{font-size:11px;color:var(--dim)}
.stat-sub{font-size:13px;color:var(--dim);margin-top:12px}

/* ---------- Verlauf ---------- */
.hist-row{
  display:flex;align-items:center;gap:14px;
  padding:15px 0;border-bottom:1px solid var(--line);
}
.hist-date{flex:1 1 auto;min-width:0}
.hist-day{font-size:15px}
.hist-meta{font-size:12.5px;color:var(--dim);margin-top:2px;display:flex;gap:7px;align-items:center}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line-strong);display:inline-block}
.pip.on{background:var(--olive)}
.hist-time{font-size:17px;font-variant-numeric:tabular-nums;text-align:right;display:flex;align-items:center;gap:7px;justify-content:flex-end}
.hist-time.goal{color:var(--olive)}
.goal-mark{width:16px;height:16px;flex:0 0 auto;color:var(--olive)}
.goal-mark.off{color:transparent}
.goal-mark svg{width:16px;height:16px;display:block}
.month{padding:30px 0 6px;border-bottom:1px solid var(--line-strong);margin-bottom:2px}
.month:first-of-type{padding-top:18px}
.month-name{font-family:"EB Garamond",Georgia,serif;font-size:22px}
.month-sum{font-size:13.5px;color:var(--dim);margin-top:5px;padding-bottom:12px}
.month-sum b{color:var(--brass);font-weight:500;font-variant-numeric:tabular-nums}
.hist-heart{font-size:12.5px;color:#C46A6A;min-width:34px;text-align:right}
.empty{
  font-family:"EB Garamond",Georgia,serif;font-size:19px;color:var(--dim);
  padding:40px 0;max-width:44ch;
}
.total-line{padding:20px 0;border-bottom:1px solid var(--line-strong);font-size:14.5px;color:var(--dim)}
.total-line b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;font-size:17px}

/* ---------- Einstellungen ---------- */
.settings{padding:26px 0 0}
.set-row{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:15px 0;border-bottom:1px solid var(--line);
}
.set-name{flex:1 1 150px;font-size:15px}
.set-val{font-size:16px;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.step{
  width:34px;height:34px;padding:0;font-size:18px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
}
.step[disabled]{opacity:.32;cursor:default}
.step[disabled]:hover{border-color:var(--line-strong);color:var(--ink)}
.set-block{padding:18px 0;border-bottom:1px solid var(--line)}
.set-label{font-size:12px;color:var(--dim);letter-spacing:.02em;padding-bottom:9px}
.set-input{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;margin-bottom:8px;
}
.set-input.sub{font-size:13.5px;color:var(--dim)}
.set-input:focus{outline:none;border-color:var(--brass);color:var(--ink)}
.set-len{display:flex;align-items:center;gap:12px;padding-top:4px}
.set-len .set-val{text-align:left;min-width:66px}
.set-msg{font-size:13px;color:var(--brass);min-height:20px;padding-top:10px}
.set-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 0}
.set-foot .lbl{flex:1 1 200px;font-size:13px;color:var(--dim)}

.page-title{font-family:"EB Garamond",Georgia,serif;font-size:25px;margin:30px 0 0}
.back{font-size:14px;color:var(--dim);text-decoration:none;display:inline-block;margin-top:22px}
.back:hover{color:var(--brass)}
.foot{padding:34px 0 0;font-size:12.5px;color:var(--dim);max-width:50ch;line-height:1.6}

@media (max-width:560px){
  body{padding:0 16px 56px}
  .verse{font-size:19.5px}
  .verse.hero{font-size:22px}
  .hour-count{font-size:25px}
  .watch-body .clock{font-size:27px}
  .ticks{height:26px}
  .tick{height:12px}.tick.q{height:18px}.tick.on{height:20px}.tick.on.q{height:26px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<script>
(function(){
"use strict";

/* ============ Verse (Elberfelder, CSV-Edition) ============ */
var HERO = {
  ref:"Matthäus 26,40-41",
  text:"<span class='vn'>40</span>Und er kommt zu den Jüngern und findet sie schlafend; und er spricht zu Petrus: Also nicht eine Stunde vermochtet ihr mit mir zu wachen? <span class='vn'>41</span>Wacht und betet, damit ihr nicht in Versuchung kommt; der Geist zwar ist willig, das Fleisch aber schwach."
};

var VERSES = [
{ref:"Psalm 34,16.18-19", text:"Die Augen des HERRN sind auf die Gerechten gerichtet und seine Ohren auf ihr Schreien. <span class='vn'>18</span>Sie schreien, und der HERR hört, und aus allen ihren Bedrängnissen errettet er sie. <span class='vn'>19</span>Nahe ist der HERR denen, die zerbrochenen Herzens sind, und die zerschlagenen Geistes sind, rettet er."},
{ref:"Psalm 91,14-15", text:"<span class='vn'>14</span>Weil er Wonne an mir hat, will ich ihn erretten; ich will ihn in Sicherheit setzen, weil er meinen Namen kennt. <span class='vn'>15</span>Er wird mich anrufen, und ich werde ihm antworten, ich werde bei ihm sein in der Bedrängnis; ich werde ihn befreien und ihn verherrlichen."},
{ref:"Psalm 145,18-19", text:"<span class='vn'>18</span>Nahe ist der HERR allen, die ihn anrufen, allen, die ihn anrufen in Wahrheit. <span class='vn'>19</span>Er tut das Verlangen derer, die ihn fürchten; ihr Schreien hört er und rettet sie."},
{ref:"Sprüche 15,29", text:"Der HERR ist fern von den Gottlosen, aber das Gebet der Gerechten hört er."},
{ref:"Matthäus 7,7-11", text:"<span class='vn'>7</span>Bittet, und es wird euch gegeben werden; sucht, und ihr werdet finden; klopft an, und es wird euch aufgetan werden. <span class='vn'>8</span>Denn jeder Bittende empfängt, und der Suchende findet, und dem Anklopfenden wird aufgetan werden. <span class='vn'>9</span>Oder welcher Mensch ist unter euch, der, wenn sein Sohn ihn um ein Brot bitten wird, ihm etwa einen Stein geben wird, <span class='vn'>10</span>oder auch, wenn er um einen Fisch bitten wird, ihm etwa eine Schlange geben wird? <span class='vn'>11</span>Wenn nun ihr, die ihr böse seid, euren Kindern gute Gaben zu geben wisst, wie viel mehr wird euer Vater, der in den Himmeln ist, denen Gutes geben, die ihn bitten!"},
{ref:"Matthäus 21,21-22", text:"Jesus aber antwortete und sprach zu ihnen: Wahrlich, ich sage euch: Wenn ihr Glauben habt und nicht zweifelt, werdet ihr nicht allein das mit dem Feigenbaum Geschehene tun, sondern selbst wenn ihr zu diesem Berg sagt: Werde aufgehoben und ins Meer geworfen!, so wird es geschehen. <span class='vn'>22</span>Und alles, was irgend ihr im Gebet glaubend erbittet, werdet ihr empfangen."},
{ref:"Markus 11,22-26", text:"Und Jesus antwortete und spricht zu ihnen: Habt Glauben an Gott. <span class='vn'>23</span>Wahrlich, ich sage euch: Wer irgend zu diesem Berg sagen wird: „Werde aufgehoben und ins Meer geworfen!“, und nicht zweifeln wird in seinem Herzen, sondern glaubt, dass geschieht, was er sagt –, dem wird es werden. <span class='vn'>24</span>Darum sage ich euch: Alles, um was ihr betet und bittet – glaubt, dass ihr es empfangt, und es wird euch werden. <span class='vn'>25</span>Und wenn ihr dasteht und betet, so vergebt, wenn ihr etwas gegen jemand habt, damit auch euer Vater, der in den Himmeln ist, euch eure Vergehungen vergebe."},
{ref:"Lukas 11,9-13", text:"Und ich sage euch: Bittet, und es wird euch gegeben werden; sucht, und ihr werdet finden; klopft an, und es wird euch aufgetan werden. <span class='vn'>10</span>Denn jeder Bittende empfängt, und der Suchende findet, und dem Anklopfenden wird aufgetan werden. <span class='vn'>11</span>Wer aber von euch ist ein Vater, den der Sohn um ein Brot bitten wird – er wird ihm doch nicht einen Stein geben? Oder auch um einen Fisch – er wird ihm statt eines Fisches doch nicht eine Schlange geben? <span class='vn'>12</span>Oder auch, wenn er um ein Ei bitten wird – er wird ihm doch nicht einen Skorpion geben? <span class='vn'>13</span>Wenn nun ihr, die ihr doch böse seid, euren Kindern gute Gaben zu geben wisst, wie viel mehr wird der Vater, der vom Himmel ist, den Heiligen Geist denen geben, die ihn bitten!"},
{ref:"Lukas 18,7-8", text:"Gott aber, sollte er das Recht seiner Auserwählten nicht ausführen, die Tag und Nacht zu ihm schreien, und ist er in Bezug auf sie langsam? <span class='vn'>8</span>Ich sage euch, dass er ihr Recht schnell ausführen wird. Doch wird wohl der Sohn des Menschen, wenn er kommt, den Glauben finden auf der Erde?"},
{ref:"Johannes 14,13-14", text:"Und um was irgend ihr bitten werdet in meinem Namen, das werde ich tun, damit der Vater verherrlicht werde in dem Sohn. <span class='vn'>14</span>Wenn ihr um etwas bitten werdet in meinem Namen, werde ich es tun."},
{ref:"Johannes 15,7", text:"Wenn ihr in mir bleibt und meine Worte in euch bleiben, so werdet ihr bitten, um was ihr wollt, und es wird euch geschehen."},
{ref:"Johannes 16,23-24", text:"<span class='vn'>23</span>Und an jenem Tag werdet ihr mich nichts fragen. Wahrlich, wahrlich, ich sage euch: Um was irgend ihr den Vater bitten werdet in meinem Namen, das wird er euch geben. <span class='vn'>24</span>Bis jetzt habt ihr um nichts gebeten in meinem Namen. Bittet, und ihr werdet empfangen, damit eure Freude völlig sei."},
{ref:"Hebräer 11,6", text:"Ohne Glauben aber ist es unmöglich, ihm wohlzugefallen; denn wer Gott naht, muss glauben, dass er ist und denen, die ihn suchen, ein Belohner ist."},
{ref:"Jakobus 1,5-8", text:"Wenn aber jemand von euch Weisheit mangelt, so erbitte er sie von Gott, der allen willig gibt und nichts vorwirft, und sie wird ihm gegeben werden. <span class='vn'>6</span>Er bitte aber im Glauben, ohne irgend zu zweifeln; denn der Zweifelnde gleicht einer Meereswoge, die vom Wind bewegt und hin und her getrieben wird. <span class='vn'>7</span>Denn jener Mensch denke nicht, dass er etwas von dem Herrn empfangen wird; <span class='vn'>8</span>er ist ein wankelmütiger Mann, unstet in allen seinen Wegen."},
{ref:"1. Petrus 3,12", text:"Denn die Augen des Herrn sind gerichtet auf die Gerechten, und seine Ohren auf ihr Flehen; das Angesicht des Herrn aber ist gegen die, die Böses tun."},
{ref:"1. Petrus 5,6-7", text:"So demütigt euch nun unter die mächtige Hand Gottes, damit er euch erhöhe zur rechten Zeit, <span class='vn'>7</span>indem ihr all eure Sorge auf ihn werft; denn er ist besorgt für euch."},
{ref:"1. Johannes 3,21-22", text:"Geliebte, wenn unser Herz uns nicht verurteilt, so haben wir Freimütigkeit zu Gott, <span class='vn'>22</span>und was irgend wir erbitten, empfangen wir von ihm, weil wir seine Gebote halten und das vor ihm Wohlgefällige tun."},
{ref:"1. Johannes 5,14-15", text:"Und dies ist die Zuversicht, die wir zu ihm haben, dass, wenn wir etwas nach seinem Willen bitten, er uns hört. <span class='vn'>15</span>Und wenn wir wissen, dass er uns hört, um was irgend wir bitten, so wissen wir, dass wir die Bitten haben, die wir von ihm erbeten haben."},
{ref:"Römer 8,26-27", text:"Ebenso aber nimmt auch der Geist sich unserer Schwachheit an; denn wir wissen nicht, was wir bitten sollen, wie es sich gebührt, aber der Geist selbst verwendet sich für uns in unaussprechlichen Seufzern. <span class='vn'>27</span>Der aber die Herzen erforscht, weiß, was der Sinn des Geistes ist, denn er verwendet sich für Heilige Gott gemäß."}
];

/* ============ Grunddaten ============ */
var SLOTS = [
  {id:"morgen", name:"Morgen-Gebet", focus:"Persönlich und Erweckung"},
  {id:"tag",    name:"Tages-Gebet",  focus:"Gemeinde, Geschwister, verfolgte Geschwister"},
  {id:"abend",  name:"Abend-Gebet",  focus:"Persönlich, Anliegen der Brüder"}
];
var SLOT_BY_ID = {};
SLOTS.forEach(function(s){ SLOT_BY_ID[s.id] = s; });
var SLOT_LEN = 15*60;   // Standardlänge je Timer, in den Einstellungen änderbar
var LEN_MIN = 5*60, LEN_MAX = 90*60, LEN_STEP = 5*60;
var GOAL = 60*60;       // Standard-Tagesziel, in den Einstellungen änderbar
var GOAL_MIN = 15*60, GOAL_MAX = 240*60, GOAL_STEP = 5*60;
var KEY = "gebetstimer.v1";

var WD = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var WD_S = ["So","Mo","Di","Mi","Do","Fr","Sa"];
var MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

/* ============ Speicher (mit Fallback ohne localStorage) ============ */
var store = (function(){
  var mem = {}, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    ok: ok,
    get: function(k){ if(!ok) return mem[k]||null; try{ return localStorage.getItem(k); }catch(e){ return mem[k]||null; } },
    set: function(k,v){ if(!ok){ mem[k]=v; return; } try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
  };
})();

var data = load();
function load(){
  var raw = store.get(KEY);
  if(!raw) return {days:{}, running:null};
  try{
    var d = JSON.parse(raw);
    if(!d || typeof d!=="object") return {days:{}, running:null};
    d.days = d.days || {};
    return d;
  }catch(e){ return {days:{}, running:null}; }
}
function save(){ store.set(KEY, JSON.stringify(data)); if(typeof schedulePush === "function") schedulePush(); }

/* ============ Datum & Zeit ============ */
function keyOf(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayKey(){ return keyOf(new Date()); }
function dateFromKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function longDate(d){ return WD[d.getDay()]+", "+d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear(); }
function shortDate(d){ return WD_S[d.getDay()]+", "+d.getDate()+"."+(d.getMonth()+1)+"."; }

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(h>0) return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtLong(sec){
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  if(m===60){ h+=1; m=0; }
  if(h>0) return h+" Std "+m+" Min";
  return m+" Min";
}

/* ============ Tagesobjekt ============ */
function blankDay(){
  var d = {spontan:0, herz:0, wach:false};
  SLOTS.forEach(function(s){ d[s.id] = {timer:0, extra:0, done:false}; });
  return d;
}
function getDay(k, create){
  var d = data.days[k];
  if(!d){
    if(!create) return blankDay();
    d = blankDay();
    data.days[k] = d;
  }
  SLOTS.forEach(function(s){ if(!d[s.id]) d[s.id] = {timer:0, extra:0, done:false}; });
  if(typeof d.spontan!=="number") d.spontan = 0;
  if(typeof d.herz!=="number") d.herz = 0;
  if(typeof d.wach!=="boolean") d.wach = false;
  return d;
}
function lenOf(slotId){
  var v = data.settings && data.settings.len && data.settings.len[slotId];
  if(typeof v !== "number" || !isFinite(v) || v < LEN_MIN) return SLOT_LEN;
  return Math.min(LEN_MAX, v);
}
function goalOf(){
  var v = data.settings && data.settings.goal;
  if(typeof v !== "number" || !isFinite(v) || v < GOAL_MIN) return GOAL;
  return Math.min(GOAL_MAX, v);
}
function goalLabel(){
  var g = goalOf(), h = Math.floor(g/3600), m = Math.round(g%3600/60);
  if(h && m) return h+" Std "+m+" Min";
  if(h) return h+" Std";
  return m+" Min";
}
function esc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function rawName(slotId){
  var v = data.settings && data.settings.name && data.settings.name[slotId];
  return (typeof v === "string" && v.trim()) ? v.trim() : SLOT_BY_ID[slotId].name;
}
function rawFocus(slotId){
  var v = data.settings && data.settings.focus && data.settings.focus[slotId];
  return (typeof v === "string" && v.trim()) ? v.trim() : SLOT_BY_ID[slotId].focus;
}
function nameOf(slotId){ return esc(rawName(slotId)); }
function focusOf(slotId){ return esc(rawFocus(slotId)); }

function setLen(slotId, sec){
  if(!data.settings) data.settings = {};
  if(!data.settings.len) data.settings.len = {};
  data.settings.len[slotId] = Math.max(LEN_MIN, Math.min(LEN_MAX, sec));
}

function dayTotal(d){
  var t = d.spontan||0;
  SLOTS.forEach(function(s){
    var x = d[s.id]||{};
    t += (x.timer||0) + (x.extra||0);
  });
  return t;
}

/* ============ Laufende Uhr ============ */
/* running = {kind:"timer"|"extra"|"spontan", slot, dateKey, base, startedAt} */
function liveValue(){
  var r = data.running;
  if(!r) return 0;
  return r.base + (Date.now() - r.startedAt)/1000;
}
function isRunning(kind, slot){
  var r = data.running;
  if(!r) return false;
  if(r.kind!==kind) return false;
  if(kind==="spontan") return true;
  return r.slot===slot;
}
function currentValue(dayObj, kind, slotId){
  if(isRunning(kind, slotId) && data.running.dateKey===currentDateKey()) return liveValue();
  if(kind==="spontan") return dayObj.spontan||0;
  return dayObj[slotId][kind]||0;
}
function commit(){
  var r = data.running;
  if(!r) return;
  var v = liveValue();
  var d = getDay(r.dateKey, true);
  if(r.kind==="spontan"){
    d.spontan = v;
  } else if(r.kind==="extra"){
    d[r.slot].extra = v;
  } else {
    var len = lenOf(r.slot);
    if(v >= len){
      d[r.slot].timer = len;
      d[r.slot].done = true;
      data.running = null;
      save();
      chime();
      return true; // fertig
    }
    d[r.slot].timer = v;
  }
  r.base = v;
  r.startedAt = Date.now();
  return false;
}
function stopAll(){ commit(); data.running = null; save(); }
function start(kind, slotId){
  var wasRunning = isRunning(kind, slotId);
  stopAll();
  if(wasRunning){ render(); return; }
  var k = todayKey();
  var d = getDay(k, true);
  var base = kind==="spontan" ? (d.spontan||0) : (d[slotId][kind]||0);
  if(kind==="timer" && base >= lenOf(slotId)) base = 0; // abgelaufener Timer startet neu
  data.running = {kind:kind, slot:slotId||null, dateKey:k, base:base, startedAt:Date.now()};
  save();
  render();
}

/* Sanfter Ton, wenn der Timer durch ist */
function chime(){
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    var ctx = new C();
    [0, .55].forEach(function(off){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = off ? 523.25 : 392.00;
      g.gain.setValueAtTime(0, ctx.currentTime+off);
      g.gain.linearRampToValueAtTime(.16, ctx.currentTime+off+.04);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+off+1.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+off); o.stop(ctx.currentTime+off+1.6);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 2600);
  }catch(e){}
}

/* ============ Sicherung ============ */
var backupMsg = "";
function exportJson(){
  stopAll();
  try{
    var payload = JSON.stringify(data, null, 2);
    var blob = new Blob([payload], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "gebetszeiten-"+todayKey()+".json";
    document.body.appendChild(a);
    a.click();
    a.parentNode.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    backupMsg = "Sicherung gespeichert.";
  }catch(e){
    backupMsg = "Die Sicherung konnte nicht erstellt werden.";
  }
  render();
}
function importJson(file){
  var fr = new FileReader();
  fr.onload = function(){
    var incoming;
    try{ incoming = JSON.parse(String(fr.result)); }
    catch(e){ backupMsg = "Diese Datei konnte nicht gelesen werden."; render(); return; }
    if(!incoming || typeof incoming!=="object" || !incoming.days || typeof incoming.days!=="object"){
      backupMsg = "Diese Datei enthält keine Gebetszeiten."; render(); return;
    }
    stopAll();
    var r = mergeInto(incoming);
    save();
    backupMsg = r.added+" Tage ergänzt, "+r.updated+" aktualisiert"+(r.kept?", "+r.kept+" unverändert":"")+".";
    render();
  };
  fr.onerror = function(){ backupMsg = "Die Datei konnte nicht gelesen werden."; render(); };
  fr.readAsText(file);
}
function mergeInto(remote){
  var out = {added:0, updated:0, kept:0, changed:false};
  if(!remote || typeof remote!=="object") return out;
  var rd = remote.days || {};
  Object.keys(rd).forEach(function(k){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    var inc = normalize(rd[k] || {});
    if(!data.days[k]){ data.days[k] = inc; out.added++; out.changed = true; return; }
    var cur = getDay(k, true), touched = false;
    SLOTS.forEach(function(sl){
      if(inc[sl.id].timer > cur[sl.id].timer){ cur[sl.id].timer = inc[sl.id].timer; touched = true; }
      if(inc[sl.id].extra > cur[sl.id].extra){ cur[sl.id].extra = inc[sl.id].extra; touched = true; }
      if(inc[sl.id].done && !cur[sl.id].done){ cur[sl.id].done = true; touched = true; }
    });
    if(inc.spontan > cur.spontan){ cur.spontan = inc.spontan; touched = true; }
    if(inc.herz > cur.herz){ cur.herz = inc.herz; touched = true; }
    if(touched){ out.updated++; out.changed = true; } else out.kept++;
  });
  var rAt = typeof remote.settingsAt === "number" ? remote.settingsAt : 0;
  var lAt = typeof data.settingsAt === "number" ? data.settingsAt : 0;
  if(remote.settings && typeof remote.settings === "object" && rAt > lAt){
    data.settings = remote.settings;
    data.settingsAt = rAt;
    out.changed = true;
  }
  return out;
}

function normalize(d){
  var o = {spontan: (typeof d.spontan==="number"?d.spontan:0), herz: (typeof d.herz==="number"?d.herz:0), wach: !!d.wach};
  SLOTS.forEach(function(s){
    var x = d[s.id] || {};
    o[s.id] = {timer:(typeof x.timer==="number"?x.timer:0), extra:(typeof x.extra==="number"?x.extra:0), done:!!x.done};
  });
  return o;
}

/* ============ Synchronisierung ============ */
var SYNC_KEY = "gebetstimer.sync";
var SYNC_APP = "gebet";
var DEFAULT_URL = "https://gebet-sync.noelatesgmx-de.workers.dev/";
var sync = loadSync();
var syncMsg = "", syncBusy = false, pushTimer = null, lastPush = 0;

function loadSync(){
  try{
    var raw = store.get(SYNC_KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && typeof o === "object"){
        return {url:o.url||DEFAULT_URL, token:o.token||"", on:!!o.on, last:o.last||0};
      }
    }
  }catch(e){}
  return {url:DEFAULT_URL, token:"", on:false, last:0};
}
function saveSync(){ store.set(SYNC_KEY, JSON.stringify(sync)); }
function touchSettings(){ data.settingsAt = Date.now(); }
function clockNow(){
  var d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function syncEndpoint(){
  return String(sync.url||"").replace(/\/+$/,"") + "/?app=" + SYNC_APP;
}

function syncNow(quiet){
  if(!sync.on || !sync.url || !sync.token){ return; }
  if(syncBusy) return;
  if(typeof fetch !== "function"){ syncMsg = "Dieser Browser kann nicht abgleichen."; render(); return; }
  syncBusy = true;
  lastPush = Date.now();
  if(!quiet){ syncMsg = "Abgleich läuft …"; render(); }
  commit();
  var url = syncEndpoint();
  fetch(url, {headers:{"X-Token": sync.token}})
    .then(function(r){
      if(r.status === 401) throw new Error("Kennwort stimmt nicht.");
      if(!r.ok) throw new Error("Fehler " + r.status);
      return r.json();
    })
    .then(function(res){
      mergeInto(res && res.data);
      save();
      return fetch(url, {
        method: "POST",
        headers: {"X-Token": sync.token, "Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
    })
    .then(function(r){
      if(!r.ok) throw new Error("Speichern fehlgeschlagen (" + r.status + ")");
      sync.last = Date.now();
      saveSync();
      syncBusy = false;
      syncMsg = "Abgeglichen um " + clockNow() + ".";
      render();
    })
    .catch(function(e){
      syncBusy = false;
      syncMsg = "Abgleich fehlgeschlagen – " + ((e && e.message) || "unbekannter Fehler");
      render();
    });
}

function schedulePush(){
  if(!sync.on || !sync.token) return;
  if(Date.now() - lastPush > 120000){ syncNow(true); return; }
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushTimer = null; syncNow(true); }, 8000);
}
function pushNow(){
  if(!sync.on || !sync.token || typeof fetch !== "function") return;
  commit();
  try{
    fetch(syncEndpoint(), {
      method: "POST",
      headers: {"X-Token": sync.token, "Content-Type": "application/json"},
      body: JSON.stringify(data),
      keepalive: true
    });
  }catch(e){}
}

/* ============ Statistik ============ */
function weekDays(){
  var now = new Date(); now.setHours(0,0,0,0);
  var off = (now.getDay()+6)%7; // Montag = 0
  var mon = new Date(now); mon.setDate(now.getDate()-off);
  var out = [];
  for(var i=0;i<7;i++){
    var d = new Date(mon); d.setDate(mon.getDate()+i);
    out.push(d);
  }
  return out;
}
function totalFor(k){
  var d = data.days[k];
  if(!d) return 0;
  var t = dayTotal(getDay(k,false));
  if(data.running && data.running.dateKey===k) t = liveTotalFor(k);
  return t;
}
function liveTotalFor(k){
  var d = getDay(k,false);
  var r = data.running;
  var t = 0;
  t += (r.kind==="spontan" ? liveValue() : (d.spontan||0));
  SLOTS.forEach(function(s){
    var x = d[s.id];
    t += (r.kind==="timer" && r.slot===s.id) ? liveValue() : (x.timer||0);
    t += (r.kind==="extra" && r.slot===s.id) ? liveValue() : (x.extra||0);
  });
  return t;
}

/* ============ Render-Bausteine ============ */
function ticksHtml(sec){
  var goal = goalOf();
  var n = Math.max(4, Math.min(120, Math.round(goal/60)));
  var per = goal/n, q = Math.max(1, Math.round(n/4));
  var html = '<div class="ticks">';
  for(var i=0;i<n;i++){
    var cls = "tick" + ((i+1)%q===0 ? " q" : "");
    if(sec >= (i+1)*per) cls += " on" + (sec>=goal ? " full" : "");
    else if(sec > i*per) cls += " part";
    html += '<div class="'+cls+'"></div>';
  }
  return html + '</div>';
}
function hourHtml(sec, note){
  var done = sec >= goalOf();
  return '<section class="hour">'
    + '<div class="hour-head">'
    +   '<div class="hour-count">'+goalLabel()+'&thinsp;/&thinsp;<b>'+fmt(sec)+'</b></div>'
    +   '<div class="hour-note'+(done?" done":"")+'">'
    +     (done ? (goalOf()===GOAL ? "Die Stunde ist voll" : "Tagesziel erreicht") : note)+'</div>'
    + '</div>'
    + ticksHtml(sec)
    + '</section>';
}
function verseHtml(v, cls){
  return '<p class="verse '+(cls||"")+'">'+v.text+'</p><div class="ref">'+v.ref+'</div>';
}
function verseOfDay(dkey){
  var d = dateFromKey(dkey);
  var days = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000);
  return VERSES[((days % VERSES.length) + VERSES.length) % VERSES.length];
}

        +       (goalOf()<=GOAL_MIN?' disabled':'')+' aria-label="weniger">&minus;</button>'
        +     '<div class="set-val">'+goalLabel()+'</div>'
        +     '<button class="btn small step" data-act="goal" data-d="1"'
        +       (goalOf()>=GOAL_MAX?' disabled':'')+' aria-label="mehr">+</button>'
        +   '</div>'
        + '</div>'

        + '<div class="set-block">'
        +   '<div class="set-label">Synchronisierung</div>'
        +   '<input class="set-input" type="url" data-field="sync-url" '
        +     'value="'+esc(sync.url)+'" placeholder="Adresse des Dienstes" aria-label="Adresse">'
        +   '<input class="set-input sub" type="password" data-field="sync-token" '
        +     'value="'+esc(sync.token)+'" placeholder="Kennwort" aria-label="Kennwort" autocomplete="off">'
        +   '<div class="row tight" style="padding-top:4px">'
        +     '<button class="btn small" data-act="syncnow">'+(sync.on ? "Jetzt abgleichen" : "Verbinden")+'</button>'
        +     (sync.on ? '<button class="btn small" data-act="syncoff">Trennen</button>' : '')
        +   '</div>'
        +   '<div class="set-msg">'+(syncMsg ? esc(syncMsg)
        :       (sync.on ? "Verbunden." : "Nicht verbunden – die Zeiten bleiben nur auf diesem Gerät."))+'</div>'
        + '</div>'

        + '<div class="set-block" style="border-bottom:0">'
        +   '<div class="set-label">Sicherung</div>'
        +   '<div class="row tight" style="padding-top:4px">'
        +     '<button class="btn small" data-act="export">Sicherung speichern</button>'
        +     '<button class="btn small" data-act="import">Sicherung laden</button>'
        +   '</div>'
        +   '<div class="set-msg">'+(backupMsg ? esc(backupMsg) : '')+'</div>'
        + '</div>'

        + '<div class="set-foot">'
        +   '<div class="lbl">Die drei Timer ergeben zusammen '
        +     Math.round(SLOTS.reduce(function(a,sl){return a+lenOf(sl.id);},0)/60)
        +     ' Minuten, das Ziel liegt bei '+goalLabel()+'. Den Rest betest du mit den Stoppuhren.</div>'
        +   '<button class="btn small" data-act="lenreset">Alles zur\u00fccksetzen</button>'
        + '</div>'
        + '</div>'
      ) : '')
  + '</section>'

  + '<p class="foot">Die Zeiten bleiben nur auf diesem Gerät gespeichert – niemand sonst sieht sie.'
  + (store.ok ? '' : ' <b>Achtung:</b> Dieser Browser erlaubt kein Speichern, die Zeiten gehen beim Schließen verloren.')
  + '</p>';
  return html;
}

function viewHeute(){
  var k = todayKey();
  var d = getDay(k, false);
  var sec = totalFor(k);
  var v = verseOfDay(k);

  var html = ''
  + '<h1 class="page-title">'+longDate(new Date())+'</h1>'
  + '<section class="day-verse">' + verseHtml(v) + '</section>'
  + hourHtml(sec, "von "+goalLabel())
  + '<section class="wake">'
  +   '<button class="wake-btn'+(d.wach?" on":"")+'" data-act="wach" aria-pressed="'+(d.wach?"true":"false")+'">'
  +     '<span class="check-mark">'+CHECK+'</span>'
  +     '<span>Zeitig aufgewacht?</span>'
  +   '</button>'
  + '</section>';

  SLOTS.forEach(function(s){
    var x = d[s.id];
    var tRun = isRunning("timer", s.id), eRun = isRunning("extra", s.id);
    var tVal = tRun ? liveValue() : (x.timer||0);
    var eVal = eRun ? liveValue() : (x.extra||0);
    var len = lenOf(s.id);
    var rest = Math.max(0, len - tVal);
    var total = (x.done ? Math.max(tVal, len) : tVal) + eVal;

    html += '<section class="watch'+(x.done?" done":"")+'">'
      + '<div class="watch-head"><span class="check-mark">'+CHECK+'</span><span class="watch-name">'+nameOf(s.id)+'</span></div>'
      + '<div class="watch-focus">'+focusOf(s.id)+'</div>'
      + '<div class="watch-body">'
      +   '<div class="clock'+(tRun?" live":"")+'">'+fmt(rest)+'</div>'
      +   '<button class="btn small'+(tRun?" running":"")+'" data-act="timer" data-slot="'+s.id+'">'
      +     (tRun ? "Anhalten" : (x.done ? "Noch einmal" : (tVal>0 ? "Weiter" : Math.round(len/60)+" Minuten beten")))
      +   '</button>'
      +   '<button class="btn small check'+(x.done?" on":"")+'" data-act="check" data-slot="'+s.id+'">'
      +     (x.done ? "Abgehakt" : "Ohne Timer abhaken")
      +   '</button>'
      + '</div>'
      + '<div class="stop">'
      +   '<div class="lbl">Länger beten – Stoppuhr</div>'
      +   '<div class="clock'+(eRun?" live":"")+'">'+fmt(eVal)+'</div>'
      +   '<button class="btn small'+(eRun?" running":"")+'" data-act="extra" data-slot="'+s.id+'">'+(eRun?"Anhalten":"Starten")+'</button>'
      + '</div>'
      + (total>0 ? '<div class="sum">Gesamt in dieser Gebetszeit: <b>'+fmt(total)+'</b></div>' : '')
      + '</section>';
  });

  var spRun = isRunning("spontan");
  var spVal = spRun ? liveValue() : (d.spontan||0);
  html += '<section class="spontan">'
    + '<div class="lbl">Weiteres Gebet außer der Reihe</div>'
    + '<div class="clock'+(spRun?" live":"")+'">'+fmt(spVal)+'</div>'
    + '<button class="btn small'+(spRun?" running":"")+'" data-act="spontan">'+(spRun?"Anhalten":"Starten")+'</button>'
    + '</section>';

  var notes = ["","Zerstreut","Mit halbem Herzen","Aufmerksam","Von Herzen","Ganz bei ihm"];
  html += '<section class="heart-block">'
    + '<p class="heart-q">Mit wie viel Herz hast du heute gebetet?</p>'
    + '<div class="hearts">'
    + [1,2,3,4,5].map(function(n){
        return '<button class="heart'+(d.herz>=n?" on":"")+'" data-act="herz" data-n="'+n+'" aria-label="'+n+' von 5" title="'+notes[n]+'">'+HEART+'</button>';
      }).join("")
    + '</div>'
    + '<div class="heart-note">'+(d.herz?notes[d.herz]:"Noch nicht eingetragen")+'</div>'
    + '</section>'
    + '<a class="back" href="#/" data-nav>Zurück zur Startseite</a>';
  return html;
}

function viewVerlauf(){
  var keys = Object.keys(data.days).filter(function(k){
    var d = getDay(k,false);
    return dayTotal(d)>0 || d.herz>0 || d.wach;
  }).sort().reverse();

  if(!keys.length){
    return '<h1 class="page-title">Alle Tage</h1>'
      + '<p class="empty">Hier stehen deine Gebetszeiten, sobald du den ersten Timer gestartet hast.</p>'
      + '<div class="row tight" style="padding-top:8px"><a class="btn primary" href="#/heute" data-nav>Zum heutigen Gebet</a></div>'
      + '<a class="back" href="#/" data-nav>Zurück zur Startseite</a>';
  }

  var sum = 0, goalDays = 0, months = {}, order = [];
  keys.forEach(function(k){
    var t = totalFor(k), m = k.slice(0,7);
    sum += t; if(t>=goalOf()) goalDays++;
    if(!months[m]){ months[m] = {sum:0, days:0, goal:0}; order.push(m); }
    months[m].sum += t;
    if(t>0) months[m].days++;
    if(t>=goalOf()) months[m].goal++;
  });

  var html = '<h1 class="page-title">Alle Tage</h1>'
    + '<div class="total-line">Insgesamt <b>'+fmtLong(sum)+'</b> an '+keys.length+' Tagen · '+goalDays+' mal das Tagesziel erreicht</div>';

  var lastMonth = null;
  keys.forEach(function(k){
    var d = getDay(k,false), t = totalFor(k), dt = dateFromKey(k), m = k.slice(0,7);
    if(m !== lastMonth){
      lastMonth = m;
      var s = months[m];
      html += '<section class="month">'
        + '<div class="month-name">'+MON[dt.getMonth()]+' '+dt.getFullYear()+'</div>'
        + '<div class="month-sum"><b>'+fmtLong(s.sum)+'</b> an '+s.days+' Gebetstagen · '
        +   s.goal+'&#8239;× das Tagesziel erreicht</div>'
        + '</section>';
    }
    html += '<div class="hist-row">'
      + '<div class="hist-date">'
      +   '<div class="hist-day">'+shortDate(dt)+'</div>'
      +   '<div class="hist-meta">'
      +     '<span class="pip early'+(d.wach?" on":"")+'" title="Zeitig aufgewacht"></span>'
      +     SLOTS.map(function(s){ return '<span class="pip'+(d[s.id].done?" on":"")+'" title="'+nameOf(s.id)+'"></span>'; }).join("")
      +     '<span>'+(d.spontan>0 ? "+ "+fmt(d.spontan)+" außer der Reihe" : "")+'</span>'
      +   '</div>'
      + '</div>'
      + '<div class="hist-heart">'+(d.herz? d.herz+"/5" : "")+'</div>'
      + '<div class="hist-time'+(t>=goalOf()?" goal":"")+'">'+fmt(t)
      +   '<span class="goal-mark'+(t>=goalOf()?"":" off")+'" title="Tagesziel erreicht">'+CHECK+'</span>'
      + '</div>'
      + '</div>';
  });
  html += '<a class="back" href="#/" data-nav>Zurück zur Startseite</a>';
  return html;
}

/* ============ Steuerung ============ */
var settingsOpen = false;
var app = document.getElementById("app");
function route(){
  var h = location.hash.replace(/^#\/?/, "");
  if(h.indexOf("heute")===0) return "heute";
  if(h.indexOf("verlauf")===0) return "verlauf";
  return "start";
}
function currentDateKey(){ return todayKey(); }

function render(){
  var r = route();
  document.getElementById("topdate").textContent = shortDate(new Date());
  app.innerHTML = r==="heute" ? viewHeute() : r==="verlauf" ? viewVerlauf() : viewStart();
}

document.addEventListener("click", function(e){
  var nav = e.target.closest("[data-nav]");
  if(nav) return; // Hash-Wechsel übernimmt der Browser

  var b = e.target.closest("[data-act]");
  if(!b) return;
  var act = b.getAttribute("data-act"), slot = b.getAttribute("data-slot");

  if(act==="timer" || act==="extra"){ start(act, slot); return; }
  if(act==="spontan"){ start("spontan", null); return; }

  if(act==="settings"){ settingsOpen = !settingsOpen; render(); return; }
  if(act==="len"){
    var sl = slot, dd2 = +b.getAttribute("data-d");
    var cur = Math.round(lenOf(sl)/LEN_STEP)*LEN_STEP;
    setLen(sl, cur + dd2*LEN_STEP);
    touchSettings(); save(); render(); return;
  }
  if(act==="goal"){
    var gd = +b.getAttribute("data-d");
    var gc = Math.round(goalOf()/GOAL_STEP)*GOAL_STEP;
    if(!data.settings) data.settings = {};
    data.settings.goal = Math.max(GOAL_MIN, Math.min(GOAL_MAX, gc + gd*GOAL_STEP));
    touchSettings(); save(); render(); return;
  }
  if(act==="lenreset"){
    data.settings = {};
    touchSettings();
    backupMsg = "";
    save(); render(); return;
  }
  if(act==="syncnow"){
    if(!sync.url || !sync.token){
      syncMsg = "Bitte Adresse und Kennwort eintragen.";
      render(); return;
    }
    sync.on = true; saveSync(); syncNow(false); return;
  }
  if(act==="syncoff"){
    sync.on = false; saveSync();
    syncMsg = "Getrennt. Die Daten auf diesem Gerät bleiben erhalten.";
    render(); return;
  }
  if(act==="export"){ exportJson(); return; }
  if(act==="import"){
    var inp = document.getElementById("importfile");
    if(inp){ inp.value = ""; inp.click(); }
    return;
  }

  if(act==="wach"){
    var dw = getDay(todayKey(), true);
    dw.wach = !dw.wach;
    save(); render(); return;
  }
  if(act==="check"){
    var d = getDay(todayKey(), true), x = d[slot];
    if(isRunning("timer", slot) || isRunning("extra", slot)) stopAll();
    var ln = lenOf(slot);
    if(x.done){ x.done = false; if(x.timer>=ln) x.timer = 0; }
    else { x.done = true; if(x.timer < ln) x.timer = ln; }
    save(); render(); return;
  }
  if(act==="herz"){
    var dd = getDay(todayKey(), true), n = +b.getAttribute("data-n");
    dd.herz = (dd.herz===n) ? 0 : n;
    save(); render(); return;
  }
});

document.addEventListener("input", function(e){
  var el = e.target.closest ? e.target.closest("[data-field]") : null;
  if(!el) return;
  var f = el.getAttribute("data-field"), sl = el.getAttribute("data-slot");
  if(f === "sync-url"){ sync.url = el.value.trim(); saveSync(); return; }
  if(f === "sync-token"){ sync.token = el.value; saveSync(); return; }
  if(!data.settings) data.settings = {};
  if(!data.settings[f]) data.settings[f] = {};
  data.settings[f][sl] = el.value;
  touchSettings();
  save();
});

var importInput = document.getElementById("importfile");
if(importInput){
  importInput.addEventListener("change", function(){
    if(this.files && this.files[0]) importJson(this.files[0]);
  });
}

window.addEventListener("hashchange", render);

var ticks = 0;
setInterval(function(){
  if(!data.running) return;
  var finished = commit();
  ticks++;
  if(finished || ticks%10===0) save();
  var ae = document.activeElement;
  if(ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA")) return;
  render();
}, 1000);

document.addEventListener("visibilitychange", function(){
  if(document.hidden){ commit(); save(); pushNow(); }
  else if(sync.on){ syncNow(true); }
});
window.addEventListener("pagehide", function(){ commit(); save(); pushNow(); });
window.addEventListener("beforeunload", function(){ commit(); save(); });

render();
if(sync.on) syncNow(true);
})();
</script>
